<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 公司名称</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }
        nav a:hover {
            color: #3498db;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin: 40px 0;
        }
        .contact-info h2, .contact-form h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .contact-item {
            margin-bottom: 25px;
        }
        .contact-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #3498db;
        }
        .contact-item p {
            font-size: 16px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>公司名称</h1>
    </header>
    
    <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="services.html">服务项目</a>
        <a href="contact.html">联系我们</a>
    </nav>
    
    <div class="container">
        <section class="page-header">
            <h1>联系我们</h1>
            <p>我们期待与您的合作</p>
        </section>
        
        <section class="contact-grid">
            <div class="contact-info">
                <h2>联系方式</h2>
                <div class="contact-item">
                    <h3>📍 地址</h3>
                    <p>北京市朝阳区某某街道123号</p>
                </div>
                <div class="contact-item">
                    <h3>📞 电话</h3>
                    <p>+86 123-4567-8900</p>
                </div>
                <div class="contact-item">
                    <h3>📧 邮箱</h3>
                    <p>info@company.com</p>
                </div>
                <div class="contact-item">
                    <h3>🕐 工作时间</h3>
                    <p>周一至周五 9:00 - 18:00</p>
                </div>
            </div>
            
            <div class="contact-form">
                <h2>发送消息</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">电话</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="message">消息</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">发送消息</button>
                </form>
            </div>
        </section>
    </div>
    
    <footer>
        <p>&copy; 2024 公司名称. 保留所有权利.</p>
    </footer>
</body>
</html>
