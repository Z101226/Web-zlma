<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }
        nav a:hover {
            color: #3498db;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            background-color: #f8f9fa;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        .feature-item {
            background-color: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        .feature-item h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>公司名称</h1>
    </header>
    
    <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="services.html">服务项目</a>
        <a href="contact.html">联系我们</a>
    </nav>
    
    <div class="container">
        <section class="hero">
            <h1>欢迎来到我们的公司</h1>
            <p>我们提供专业的解决方案，助力您的业务发展</p>
            <a href="contact.html" class="btn">联系我们</a>
        </section>
        
        <section class="features">
            <div class="feature-item">
                <h3>专业团队</h3>
                <p>拥有多年行业经验的专业团队</p>
            </div>
            <div class="feature-item">
                <h3>优质服务</h3>
                <p>提供全方位的优质服务体验</p>
            </div>
            <div class="feature-item">
                <h3>创新技术</h3>
                <p>采用最新的技术和解决方案</p>
            </div>
        </section>
    </div>
    
    <footer>
        <p>&copy; 2024 公司名称. 保留所有权利.</p>
    </footer>
</body>
</html>
